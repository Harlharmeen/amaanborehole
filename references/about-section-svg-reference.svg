<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1440" height="900" viewBox="0 0 1440 900">
  <title>Amaan — About section</title>
  <desc>Standalone About Amaan website section with company introduction, mission, image placeholder and three guiding principles.</desc>
  <defs>
    <linearGradient id="imagePlaceholder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8EFF3"/>
      <stop offset="1" stop-color="#DCE7ED"/>
    </linearGradient>
    <pattern id="gridPattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#B9CAD4" stroke-width="0.7" opacity="0.42"/>
    </pattern>
    <clipPath id="imageClip">
      <rect x="908" y="142" width="468" height="468" rx="18"/>
    </clipPath>
  </defs>

  <!-- Section background -->
  <rect width="1440" height="900" fill="#F2F6F8"/>

  <!-- Section marker -->
  <g font-family="Inter, Manrope, Arial, sans-serif">
    <text x="64" y="82" fill="#0D3F5C" font-size="13" font-weight="700" letter-spacing="2.1">03  /  ABOUT AMAAN</text>
    <line x1="270" y1="77" x2="1376" y2="77" stroke="#CFDCE3" stroke-width="1"/>
    <text x="1376" y="62" text-anchor="end" fill="#758894" font-size="10" font-weight="600" letter-spacing="1.6">WHO WE ARE</text>
  </g>

  <!-- Main left content -->
  <g font-family="Inter, Manrope, Arial, sans-serif">
    <text x="64" y="194" fill="#202326" font-size="58" font-weight="700" letter-spacing="-2.1">Practical expertise.</text>
    <text x="64" y="264" fill="#202326" font-size="58" font-weight="700" letter-spacing="-2.1">Engineering-led</text>
    <text x="64" y="334" fill="#202326" font-size="58" font-weight="700" letter-spacing="-2.1">solutions.</text>

    <text x="66" y="399" fill="#4F606A" font-size="18" font-weight="400">
      <tspan x="66" dy="0">Amaan Borehole Drilling &amp; Geotechnical Services supports</tspan>
      <tspan x="66" dy="29">property owners, developers and contractors with dependable</tspan>
      <tspan x="66" dy="29">drilling and ground investigation services.</tspan>
    </text>

    <!-- Mission statement -->
    <rect x="64" y="501" width="3" height="78" rx="1.5" fill="#B88A2E"/>
    <text x="86" y="516" fill="#0D3F5C" font-size="11" font-weight="700" letter-spacing="1.7">OUR MISSION</text>
    <text x="86" y="543" fill="#354750" font-size="15.5" font-weight="400">
      <tspan x="86" dy="0">To deliver dependable ground and water solutions through</tspan>
      <tspan x="86" dy="23">informed assessment and responsible execution.</tspan>
    </text>

    <!-- CTA -->
    <g>
      <rect x="64" y="622" width="258" height="58" rx="8" fill="#0D3F5C"/>
      <text x="91" y="657" fill="#FFFFFF" font-size="15" font-weight="650">Learn More About Amaan</text>
      <path d="M286 644h14m-6-6 6 6-6 6" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Square image placeholder -->
  <g clip-path="url(#imageClip)">
    <rect x="908" y="142" width="468" height="468" fill="url(#imagePlaceholder)"/>
    <rect x="908" y="142" width="468" height="468" fill="url(#gridPattern)" opacity="0.72"/>
    <!-- quiet geometric framing -->
    <path d="M954 188h46M954 188v46M1330 188h-46M1330 188v46M954 564h46M954 564v-46M1330 564h-46M1330 564v-46" fill="none" stroke="#8FA6B4" stroke-width="1.2" opacity="0.9"/>
    <g transform="translate(1142 356)">
      <rect x="-27" y="-27" width="54" height="54" rx="10" fill="#F7FAFB" stroke="#A9BBC5" stroke-width="1.2"/>
      <path d="M0 -14v28M-14 0h28" stroke="#0D3F5C" stroke-width="1.5" stroke-linecap="round" opacity="0.75"/>
    </g>
    <text x="1142" y="414" text-anchor="middle" fill="#456171" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">IMAGE PLACEHOLDER</text>
    <text x="1142" y="436" text-anchor="middle" fill="#728894" font-family="Inter, Manrope, Arial, sans-serif" font-size="11" font-weight="400">Square field / project photograph</text>
  </g>
  <rect x="908.5" y="142.5" width="467" height="467" rx="18" fill="none" stroke="#C9D7DE" stroke-width="1"/>

  <!-- Floating engineering approach panel -->
  <g font-family="Inter, Manrope, Arial, sans-serif">
    <rect x="848" y="537" width="528" height="126" rx="12" fill="#0D3F5C"/>
    <text x="878" y="570" fill="#BFD1DB" font-size="10" font-weight="700" letter-spacing="1.8">OUR ENGINEERING-LED APPROACH</text>
    <g fill="#FFFFFF" font-size="15" font-weight="600">
      <text x="878" y="614">Assess</text>
      <text x="1060" y="614">Plan</text>
      <text x="1218" y="614">Execute</text>
    </g>
    <g stroke="#91AEBE" stroke-width="1.2" fill="none" opacity="0.8">
      <path d="M972 609h49m-7-6 7 6-7 6"/>
      <path d="M1138 609h43m-7-6 7 6-7 6"/>
    </g>
    <circle cx="867" cy="609" r="2.5" fill="#D2A44E"/>
    <circle cx="1049" cy="609" r="2.5" fill="#D2A44E"/>
    <circle cx="1207" cy="609" r="2.5" fill="#D2A44E"/>
  </g>

  <!-- Guiding principles -->
  <line x1="64" y1="734" x2="1376" y2="734" stroke="#CFDCE3" stroke-width="1"/>
  <g font-family="Inter, Manrope, Arial, sans-serif">
    <text x="64" y="777" fill="#0D3F5C" font-size="11" font-weight="700" letter-spacing="1.8">WHAT GUIDES US</text>
    <text x="64" y="802" fill="#758894" font-size="12" font-weight="400">The principles behind our work.</text>

    <line x1="395" y1="761" x2="395" y2="828" stroke="#D5E0E5" stroke-width="1"/>
    <text x="430" y="779" fill="#B88A2E" font-size="11" font-weight="700" letter-spacing="1.4">01</text>
    <text x="430" y="808" fill="#202326" font-size="18" font-weight="650">Technical understanding</text>
    <text x="430" y="831" fill="#687B85" font-size="12.5" font-weight="400">Decisions informed by the conditions on site.</text>

    <line x1="730" y1="761" x2="730" y2="828" stroke="#D5E0E5" stroke-width="1"/>
    <text x="765" y="779" fill="#B88A2E" font-size="11" font-weight="700" letter-spacing="1.4">02</text>
    <text x="765" y="808" fill="#202326" font-size="18" font-weight="650">Professional practice</text>
    <text x="765" y="831" fill="#687B85" font-size="12.5" font-weight="400">A considered process at every project stage.</text>

    <line x1="1060" y1="761" x2="1060" y2="828" stroke="#D5E0E5" stroke-width="1"/>
    <text x="1095" y="779" fill="#B88A2E" font-size="11" font-weight="700" letter-spacing="1.4">03</text>
    <text x="1095" y="808" fill="#202326" font-size="18" font-weight="650">Reliable delivery</text>
    <text x="1095" y="831" fill="#687B85" font-size="12.5" font-weight="400">Clear communication. Purposeful execution.</text>
  </g>
</svg>
